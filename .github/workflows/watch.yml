name: 甄試名單監看（手動測試用）

on:
  workflow_dispatch:
    inputs:
      test_mail:
        description: "寄一封測試信"
        type: boolean
        default: false
      debug:
        description: "印出除錯資訊"
        type: boolean
        default: false
      year:
        description: "目標學年度（測試用，平常 116）"
        type: string
        default: "116"
      dump_url:
        description: "（除錯）列出某網頁的所有連結"
        type: string
        default: ""
      selftest_url:
        description: "（測試）把這個網址當成名單來比對"
        type: string
        default: ""
      selftest_id:
        description: "（測試）要找的號碼"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 檢查公告
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NSYSU_ID: ${{ secrets.NSYSU_ID }}
          NCU_ID: ${{ secrets.NCU_ID }}
          NTUST_ID: ${{ secrets.NTUST_ID }}
          TARGET_YEAR: ${{ inputs.year || '116' }}
          DUMP_URL: ${{ inputs.dump_url }}
          SELFTEST_URL: ${{ inputs.selftest_url }}
          SELFTEST_ID: ${{ inputs.selftest_id }}
          SELFTEST_GREP: ${{ inputs.selftest_id == '' && inputs.year != '116' && inputs.year || '' }}
        run: python watch.py ${{ inputs.test_mail && '--test-mail' || '' }} ${{ inputs.debug && '--debug' || '' }}
      - name: 儲存狀態
        run: |
          git config user.name "admission-watch"
          git config user.email "admission-watch@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
